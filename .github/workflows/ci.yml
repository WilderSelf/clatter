name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branding gate reads commit messages, so it needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The gate scans the repository description and topics from a file.
      # gh is installed on the runner and GITHUB_TOKEN authenticates it.
      - name: Read the repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}" > "${RUNNER_TEMP}/repo-metadata.json"

      # Runs after the build, so dist/ is scanned as well as the tracked tree.
      # check-branding-count.sh wraps the gate and fails when the gate scanned
      # fewer files than git ls-files plus find dist -type f.
      #
      # CLATTER_BRANDING_SKIP_EXT is a test-only variable that makes the gate
      # under-report. It must never be set here. Setting it would blind the
      # file-count denominator.
      - name: Branding gate over four surfaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          META: ${{ runner.temp }}/repo-metadata.json
        run: |
          set -eu
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # A pull request scans the commits of the branch, not the whole history.
            sh scripts/check-branding-count.sh --base "${BASE_SHA}" --metadata-file "${META}"
          else
            # A push has no pull-request base. The commits surface needs a range,
            # and the first push holds one commit with no parent, so the message
            # of HEAD is scanned as a file instead.
            git show -s --format=%B HEAD > "${RUNNER_TEMP}/head-message.txt"
            sh scripts/check-branding-count.sh \
              --surface tracked,dist,metadata \
              --metadata-file "${META}" \
              --file "${RUNNER_TEMP}/head-message.txt"
          fi

      - name: Bundle size against budgets.json
        run: node scripts/check-bundle-size.mjs

      # The accessibility gate — Unit 4.11.
      #
      # One keyboard-only run over the BUILT application, from an empty pool to
      # a pushed result, with real Tab, arrow, Enter and Escape presses. It
      # starts and stops its own preview server, so the build above is what it
      # drives.
      #
      # `--no-webgl` DECLARES that this machine has no graphics card, which no
      # CI runner has. The mode refuses to run without that declaration or
      # `--hardware`, because a run that reads no renderer would otherwise skip
      # its 3D checks and exit 0 while judging nothing. Decision 23.
      #
      # What CI judges: both keyboard walks, the live region after the roll and
      # after the push, the disclosure sheet as a real modal, and the audit over
      # a laid-out page. What it does not: the same walk over the 3D table,
      # which needs a card. That half prints NOT JUDGED and counts in skipped=.
      - name: Accessibility gate, keyboard only
        run: |
          set -eu
          browser="$(command -v firefox)"
          echo "driving ${browser}"
          node scripts/browser.mjs --a11y --no-webgl \
            --url http://localhost:4173/clatter/ --browser "${browser}"

      # The ground-coverage gate — Unit 4.13.
      #
      # Every rule of src/shell.css that paints a ground carries the material
      # grain, or measures under one coarse feature of the grain that would
      # apply to it, or is a declared meaning mark, or is the one declared
      # exception. The gate reads the stylesheet, the computed styles the
      # browser resolved and the boxes it laid out.
      #
      # It is a mode of its own rather than part of `--theme`, because `--theme`
      # needs a graphics card for its 3D repaint check and no CI runner has one.
      # This gate needs none, and it judges no renderer, so it skips nothing.
      # `--no-webgl` DECLARES the machine and the run asserts the refusal landed,
      # so a pass here says something about the runner and not about a card.
      - name: Every ground the stylesheet paints carries the grain
        run: |
          set -eu
          browser="$(command -v firefox)"
          echo "driving ${browser}"
          node scripts/browser.mjs --grounds --no-webgl \
            --url http://localhost:4173/clatter/ --browser "${browser}"

      # The steps-to-rest gate. It runs the tray physics on the CPU with no
      # renderer, so it cannot flake on a GPU or on a shared runner. It stays
      # out of the validate list, because a validation attempt is capped and a
      # perf run must never spend one.
      #
      # --slow is a test-only flag that shrinks the timestep and makes the same
      # throw take more steps. It must never be set here. Setting it would turn
      # the gate red for a reason nobody changed.
      - name: Steps to rest against budgets.json
        run: npm run perf
